name: Run stamp.sh

on:
  push:
    branches:
      - setup
    paths:
      - .stamp_config
      - .github/workflows/stamp.yml
  workflow_dispatch:

jobs:
  fix-formatting:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run stamp.sh
        run: |
          echo < .stamp_config
          #./stamp.sh < .stamp_config
