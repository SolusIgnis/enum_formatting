name: Run stamp.sh

on:
  push:
    branches:
      - setup
  workflow_dispatch:

jobs:
  fix-formatting:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run stamp.sh
        run: |
         ./stamp.sh < .stamp_config
